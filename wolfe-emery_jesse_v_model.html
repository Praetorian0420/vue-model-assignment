<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue v-model Component</title>
    <script src="https://unpkg.com/vue@3"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #eef6ff, #fdf2f8);
            --card-bg: rgba(255, 255, 255, 0.9);
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #dbeafe;
            --shadow: 0 20px 45px rgba(37, 99, 235, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text);
        }

        #app {
            width: min(90vw, 520px);
            background: var(--card-bg);
            padding: 2.25rem;
            border-radius: 18px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            backdrop-filter: blur(6px);
        }

        .custom-input-wrap {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.6rem;
            font-weight: 700;
            color: var(--text);
        }

        input {
            width: 100%;
            padding: 0.9rem 1rem;
            font-size: 1rem;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: #fff;
            color: var(--text);
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
            transform: translateY(-1px);
        }

        .value-box {
            margin-top: 1.25rem;
            padding: 1rem 1.1rem;
            border-radius: 12px;
            background: linear-gradient(135deg, #eff6ff, #fdf2f8);
            border: 1px solid #dbeafe;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text);
        }

        .value-box strong {
            color: var(--primary-dark);
        }
    </style>
</head>
<body>
    <div id="app">
        <custom-input v-model="message"></custom-input>
        <div class="value-box">
            <strong>Current Value:</strong> {{ message || 'empty' }}
        </div>
    </div>

    <script>
        const CustomInput = {
            props: {
                modelValue: {
                    type: String,
                    default: ''
                }
            },
            emits: ['update:modelValue'],
            template: `
                <div class="custom-input-wrap">
                    <label for="custom-input">Enter text:</label>
                    <input
                        id="custom-input"
                        type="text"
                        :value="modelValue"
                        @input="$emit('update:modelValue', $event.target.value)"
                        placeholder="Type something..."
                    >
                </div>
            `
        };

        Vue.createApp({
            components: {
                CustomInput
            },
            data() {
                return {
                    message: ''
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
