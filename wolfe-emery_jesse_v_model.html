<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue v-model Component</title>
    <script src="https://unpkg.com/vue@3"></script>
    <style>
        :root {
            --bg-gradient: radial-gradient(ellipse at 50% 38%, #193c38 0%, #17191b 42%, #090b0e 100%);
            --card-bg: rgba(17, 20, 23, 0.94);
            --primary: #e88763;
            --primary-dark: #ffc09a;
            --text: #f2eee7;
            --muted: #a8a39a;
            --border: rgba(232, 135, 99, 0.3);
            --shadow: 0 28px 80px rgba(0, 0, 0, 0.62), 0 0 70px rgba(232, 135, 99, 0.1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Georgia, 'Times New Roman', serif;
            background: var(--bg-gradient);
            color: var(--text);
            padding: 1.5rem;
        }

        #app {
            width: min(100%, 520px);
            background: var(--card-bg);
            padding: 2.25rem;
            border-radius: 4px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(12px);
        }

        #app::before {
            content: '';
            position: absolute;
            inset: 0 0 auto;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary), #ffd7b8, var(--primary), transparent);
        }

        #app::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 12%;
            right: 12%;
            height: 1px;
            background: rgba(255, 225, 173, 0.16);
            box-shadow: 0 0 28px 8px rgba(232, 135, 99, 0.09);
            pointer-events: none;
        }

        .custom-input-wrap {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.6rem;
            font-weight: 700;
            color: var(--primary-dark);
            font-family: Arial, sans-serif;
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 0.9rem 1rem;
            font-size: 1rem;
            border: 1px solid rgba(226, 216, 201, 0.25);
            border-radius: 3px;
            background: #0d1012;
            color: var(--text);
            font-family: Arial, sans-serif;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        input::placeholder {
            color: #77736c;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: #121517;
            box-shadow: 0 0 0 3px rgba(232, 135, 99, 0.12), 0 0 24px rgba(232, 135, 99, 0.08);
        }

        .value-box {
            margin-top: 1.25rem;
            padding: 1rem 1.1rem;
            border-radius: 3px;
            background: linear-gradient(110deg, rgba(232, 135, 99, 0.1), rgba(255, 255, 255, 0.015));
            border: 1px solid rgba(232, 135, 99, 0.22);
            font-family: Arial, sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text);
            overflow-wrap: anywhere;
        }

        .value-box strong {
            color: var(--primary-dark);
            font-size: 0.76rem;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            margin-right: 0.35rem;
        }

        @media (max-width: 480px) {
            #app {
                width: 100%;
                padding: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <custom-input v-model="message"></custom-input>
        <div class="value-box">
            <strong>Current Value:</strong> {{ message || 'empty' }}
        </div>
    </div>

    <script>
        const CustomInput = {
            props: {
                modelValue: {
                    type: String,
                    default: ''
                }
            },
            emits: ['update:modelValue'],
            template: `
                <div class="custom-input-wrap">
                    <label for="custom-input">Enter text:</label>
                    <input
                        id="custom-input"
                        type="text"
                        :value="modelValue"
                        @input="$emit('update:modelValue', $event.target.value)"
                        placeholder="Type something..."
                    >
                </div>
            `
        };

        Vue.createApp({
            components: {
                CustomInput
            },
            data() {
                return {
                    message: ''
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
